# Runs on every pull request and push to main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Assemble app bundle
        env:
          UNIVERSAL: "1"
        run: scripts/build-app.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Cask renders as valid Ruby
        run: scripts/render-cask.sh 0.0.0 "$(printf '0%.0s' {1..64})" | ruby -c
